{% include "header.html" %}

<!-- Internship section start  -->
<style>
    .card-container {
        perspective: 1000px;
        width: 300px;
        margin: 20px;
    }

    .card {
        width: 100%;
        height: 500px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s;
    }

    .card-container:hover .card {
        transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
        width: 100%;
        height: 100%;
        position: absolute;
        backface-visibility: hidden;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .card-front {
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .card-front img {
        width: 100%;
        height: 250px;
        object-fit: cover;
    }

    .card-front h2 {
        padding: 10px;
        font-size: 20px;
    }

    .card-back {
        background: #f8f8f8;
        transform: rotateY(180deg);
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .card-back p {
        flex-grow: 1;
    }

    .btn a {
        text-decoration: none;
        color: white;
    }

    .btn {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        cursor: pointer;
        text-align: center;
    }

    .btn:hover {
        background-color: #0056b3;
    }
</style>
<section id="internship" class="internship">
    <h1 class="heading">Career</h1>
    <div class="row">

        {% for n in internships %}

        <div class="card-container">
            <div class="card">
                <div class="card-front">
                    <img src="/media/{{n.job_image}}" alt="androiddevelopment">
                    <h2>{{n.job_name}}</h2>
                </div>
                <div class="card-back">
                    <p>{{n.job_desc|safe}}</p>
                    <button class="btn"><a href="/form">Apply Now</a></button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</section>

<!-- Internship section ends  -->
